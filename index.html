<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Memory Reel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="stage" class="stage" aria-live="polite">
      <button
        id="play"
        class="play"
        type="button"
        aria-label="Play"
        hidden
      >
        <span class="play__ring" aria-hidden="true">
          <span class="play__triangle"></span>
        </span>
      </button>

      <p id="line" class="line" hidden></p>

      <div id="reel" class="reel" hidden aria-hidden="true">
        <div id="reel-strip" class="reel__strip">
          <img src="pixel/01.png" alt="" draggable="false" />
          <img src="pixel/02.png" alt="" draggable="false" />
          <img src="pixel/03.png" alt="" draggable="false" />
          <img src="pixel/04.png" alt="" draggable="false" />
          <img src="pixel/05.png" alt="" draggable="false" />
          <img src="pixel/06.png" alt="" draggable="false" />
          <img src="pixel/07.png" alt="" draggable="false" />
          <img src="pixel/08.png" alt="" draggable="false" />
        </div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
