<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Ann Birthday Game 2026</title>
    <link rel="stylesheet" href="style.css?v=20261124assets" />
  </head>
  <body>
    <main id="stage" class="stage" aria-live="polite">
      <p class="build-stamp" aria-hidden="true">溫馨版</p>

      <section id="world" class="world">
        <div id="vista" class="vista-host" hidden aria-hidden="true"></div>

        <div id="reel" class="reel" hidden aria-hidden="true">
          <div id="reel-strip" class="reel__strip"></div>
        </div>

        <div id="scene" class="scene" hidden aria-hidden="true">
          <img id="scene-img" class="scene__img" alt="" draggable="false" />
        </div>

        <button id="play" class="play" type="button" aria-label="播放" hidden>
          <span class="play__ring" aria-hidden="true">
            <span class="play__triangle"></span>
          </span>
        </button>
      </section>

      <section id="dock" class="dock">
        <div id="speech" class="speech" hidden>
          <div class="speech__panel">
            <p id="speech-kind" class="speech__kind"></p>
            <p id="speech-text" class="speech__text"></p>
            <span class="speech__caret" aria-hidden="true">▼</span>
          </div>
        </div>

        <form id="input-form" class="panel-card input-form" hidden>
          <label id="input-label" class="input-form__label" for="input-field"></label>
          <input
            id="input-field"
            class="input-form__field"
            type="text"
            maxlength="16"
            autocomplete="off"
            enterkeyhint="done"
          />
          <button id="input-submit" class="confirm" type="submit"></button>
        </form>

        <div id="chooser" class="panel-card chooser" hidden>
          <p id="chooser-prompt" class="chooser__prompt"></p>
          <div id="chooser-options" class="chooser__options"></div>
          <button id="chooser-submit" class="confirm" type="button"></button>
        </div>

        <div id="gate" class="panel-card gate" hidden>
          <button id="confirm" class="confirm" type="button"></button>
          <p id="gate-hint" class="gate__hint" hidden></p>
        </div>
      </section>

      <div id="heart-overlay" class="heart-overlay" hidden aria-hidden="true">
        <div class="heart-stage">
          <div class="heart-board">
            <img class="heart-q heart-q--1" data-piece="1" src="assets/art/icons/hearts/heart_shard_1.png" alt="" />
            <img class="heart-q heart-q--2" data-piece="2" src="assets/art/icons/hearts/heart_shard_2.png" alt="" />
            <img class="heart-q heart-q--3" data-piece="3" src="assets/art/icons/hearts/heart_shard_3.png" alt="" />
            <img class="heart-q heart-q--4" data-piece="4" src="assets/art/icons/hearts/heart_shard_4.png" alt="" />
            <img
              id="heart-full"
              class="heart-full"
              src="assets/art/icons/hearts/heart_assembled.png"
              alt=""
              hidden
            />
          </div>
          <p id="heart-label" class="heart-label">1 / 4</p>
        </div>
      </div>

      <button id="tap" class="tap" type="button" aria-label="繼續" hidden></button>
      <button id="mute" class="mute" type="button" aria-label="音樂開關" hidden>♪</button>
      <aside id="debug" class="debug" hidden></aside>
    </main>

    <script type="module" src="js/main.js?v=20261124assets"></script>
  </body>
</html>
