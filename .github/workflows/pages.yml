# Deploy static site to GitHub Pages (works with a private repo if your plan allows Pages).
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Split build/upload from deploy so deploy-pages can reliably find the
  # github-pages artifact (avoids a known same-job artifact metadata race).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # First run: create Pages site + set source to GitHub Actions
          enablement: true

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css cards.html cards.css cards-qpixel-test.html cards-qpixel-test.css _site/
          cp -r js pixel scripts assets _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
